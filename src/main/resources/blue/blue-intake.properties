robot.name = RED_INTAKE

# All subsystem properties should start with the name of subsystem (for this example "myFlywheel")
topIntakeFlywheel.motor.subsystemChild = flywheel
# the motorController ("talonFX" | "sparkMax" | "sim")
topIntakeFlywheel.motor.motorController = talonFX
# All motors will have an io setting
topIntakeFlywheel.IOSettings.inverted = false
topIntakeFlywheel.IOSettings.gearing = 3.0
topIntakeFlywheel.IOSettings.drumRadiusMeters = 1.0
topIntakeFlywheel.IOSettings.pid.kp = 0.0
topIntakeFlywheel.IOSettings.pid.ki = 0.0
topIntakeFlywheel.IOSettings.pid.kd = 0.0

# the motorController settings must match the motorController defined above (for sim not necessary)
topIntakeFlywheel.talonFX.setting.id = 22


# the setting for the flywheel must start with the name defined above
topIntakeFlywheel.flywheelSettings.maxVelocityInRPMs = 6000.0
topIntakeFlywheel.flywheelSettings.targetVelocityToleranceInRPMs = 100.0

# these values are assuming that the speed is in radians per seconds
topIntakeFlywheel.flywheelSettings.feedforward.ks = 0.0
topIntakeFlywheel.flywheelSettings.feedforward.kv = 0.0

topIntakeFlywheel.flywheelSettings.color.red = 0
topIntakeFlywheel.flywheelSettings.color.green = 222
topIntakeFlywheel.flywheelSettings.color.blue = 80

topIntakeFlywheel.flywheelSettings.DCMotor = KrakenX60
topIntakeFlywheel.flywheelSettings.moiKgMetersSquared = 0.001



# All subsystem properties should start with the name of subsystem (for this example "myFlywheel")
bottomIntakeFlywheel.motor.subsystemChild = flywheel
