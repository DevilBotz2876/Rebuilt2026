robot.name = RED
robot.drive = ctre


#all tuner constants start with ctre
#when an value is an enum value the name mys
ctre.steerGains.kp = 100.0
ctre.steerGains.ki = 0.0
ctre.steerGains.kd = 0.5
ctre.steerGains.ks = 0.1
ctre.steerGains.kv = 2.66
ctre.steerGains.ka = 0.0
#when an value is an enum constant, the value must match the name of the enum constant excatly
ctre.steerGains.staticFeedforwardSign = UseClosedLoopSign

ctre.driveGains.kp = 0.1
ctre.driveGains.ki = 0.0
ctre.driveGains.kd = 0.0
ctre.driveGains.ks = 0.0
ctre.driveGains.kv = 0.124

ctre.steerClosedLoopOutput = Voltage
ctre.driveClosedLoopOutput = Voltage

ctre.steerMotorType = TalonFX_Integrated
ctre.driveMotorType = TalonFX_Integrated
ctre.steerFeedbackType = FusedCANcoder

ctre.slipCurrentInAmps = 120.0
ctre.steerStatorCurrentLimitInAmps = 60.0

# ctre.canbus.name = only if using CANivore
ctre.canbus.hootFilePath = ./logs/example.hoot

ctre.speedAt12VoltsInMetersPerSecond = 4.15
ctre.coupleRatio = 3.5714285714285716
ctre.driveGearRatio = 6.746031746031747
ctre.steerGearRatio = 21.428571428571427

ctre.wheelRadiusInInches = 1.8125
ctre.invertLeftSide = false
ctre.invertRightSide = true

ctre.steerInertiaInKilogramSquareMeters = 0.01
ctre.driveInertiaInKilogramSquareMeters = 0.01

ctre.steerFrictionVoltage = 0.2
ctre.driveFrictionVoltage = 0.2

ctre.pigeonId = 60

ctre.frontLeft.driveMotorId = 10
ctre.frontLeft.steerMotorId = 11
ctre.frontLeft.encoderId = 44
ctre.frontLeft.encoderOffsetInRotations = -0.36376953125
ctre.frontLeft.steerInverted = true
ctre.frontLeft.encoderInverted = false
ctre.frontLeft.xPosInInches = 10.75
ctre.frontLeft.yPosInInches = 10.75

ctre.frontRight.driveMotorId = 16
ctre.frontRight.steerMotorId = 17
ctre.frontRight.encoderId = 42
ctre.frontRight.encoderOffsetInRotations = -0.26611328125
ctre.frontRight.steerInverted = true
ctre.frontRight.encoderInverted = false
ctre.frontRight.xPosInInches = 10.75
ctre.frontRight.yPosInInches = -10.75

ctre.backLeft.driveMotorId = 12
ctre.backLeft.steerMotorId = 13
ctre.backLeft.encoderId = 41
ctre.backLeft.encoderOffsetInRotations = 0.06640625
ctre.backLeft.steerInverted = true
ctre.backLeft.encoderInverted = false
ctre.backLeft.xPosInInches = -10.75
ctre.backLeft.yPosInInches = 10.75

ctre.backRight.driveMotorId = 14
ctre.backRight.steerMotorId = 15
ctre.backRight.encoderId = 43
ctre.backRight.encoderOffsetInRotations = -0.489501953125
ctre.backRight.steerInverted = true
ctre.backRight.encoderInverted = false
ctre.backRight.xPosInInches = -10.75
ctre.backRight.yPosInInches = -10.75



robot.name = RED_INTAKE

# All subsystem properties should start with the name of subsystem (for this example "myFlywheel")
topIntakeFlywheel.motor.subsystemChild = flywheel
# the motorController ("talonFX" | "sparkMax" | "sim")
topIntakeFlywheel.motor.motorController = talonFX
# All motors will have an io setting
topIntakeFlywheel.IOSettings.inverted = false
topIntakeFlywheel.IOSettings.gearing = 3.0
topIntakeFlywheel.IOSettings.drumRadiusMeters = 1.0
topIntakeFlywheel.IOSettings.pid.kp = 0.0
topIntakeFlywheel.IOSettings.pid.ki = 0.0
topIntakeFlywheel.IOSettings.pid.kd = 0.0

# the motorController settings must match the motorController defined above (for sim not necessary)
topIntakeFlywheel.talonFX.setting.id = 22


# the setting for the flywheel must start with the name defined above
topIntakeFlywheel.flywheelSettings.maxVelocityInRPMs = 6000.0
topIntakeFlywheel.flywheelSettings.targetVelocityToleranceInRPMs = 100.0

# these values are assuming that the speed is in radians per seconds
topIntakeFlywheel.flywheelSettings.feedforward.ks = 0.0
topIntakeFlywheel.flywheelSettings.feedforward.kv = 0.0

topIntakeFlywheel.flywheelSettings.color.red = 227
topIntakeFlywheel.flywheelSettings.color.blue = 70
topIntakeFlywheel.flywheelSettings.color.green = 23

topIntakeFlywheel.flywheelSettings.DCMotor = KrakenX60
topIntakeFlywheel.flywheelSettings.moiKgMetersSquared = 0.001



# All subsystem properties should start with the name of subsystem (for this example "myFlywheel")
bottomIntakeFlywheel.motor.subsystemChild = flywheel
# the motorController ("talonFX" | "sparkMax" | "sim")
bottomIntakeFlywheel.motor.motorController = talonFX
# All motors will have an io setting
bottomIntakeFlywheel.IOSettings.inverted = false
bottomIntakeFlywheel.IOSettings.gearing = 3.0
bottomIntakeFlywheel.IOSettings.drumRadiusMeters = 1.0
bottomIntakeFlywheel.IOSettings.pid.kp = 0.0
bottomIntakeFlywheel.IOSettings.pid.ki = 0.0
bottomIntakeFlywheel.IOSettings.pid.kd = 0.0

# the motorController settings must match the motorController defined above (for sim not necessary)
bottomIntakeFlywheel.talonFX.setting.id = 21


# the setting for the flywheel must start with the name defined above
bottomIntakeFlywheel.flywheelSettings.maxVelocityInRPMs = 6000.0
bottomIntakeFlywheel.flywheelSettings.targetVelocityToleranceInRPMs = 100.0

# these values are assuming that the speed is in radians per seconds
bottomIntakeFlywheel.flywheelSettings.feedforward.ks = 0.0
bottomIntakeFlywheel.flywheelSettings.feedforward.kv = 0.0

bottomIntakeFlywheel.flywheelSettings.color.red = 171
bottomIntakeFlywheel.flywheelSettings.color.blue = 52
bottomIntakeFlywheel.flywheelSettings.color.green = 12

bottomIntakeFlywheel.flywheelSettings.DCMotor = KrakenX60
bottomIntakeFlywheel.flywheelSettings.moiKgMetersSquared = 0.001

