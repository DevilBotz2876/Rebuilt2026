robot.drive = base

vision.fieldlayout = k2026RebuiltAndymark
vision.addDrivetrain = true

vision.settings.timestampToleranceSeconds = 10
vision.settings.maximumSingleTagDistanceMeters = 2.0;
vision.settings.maximumMultiTagDistanceMeters = 3.9;
vision.settings.visionLoggingDebug = true;
# name of cameras
vision.cameras = frontRight, frontLeft, backRight, backLeft

# front right
frontRight.cameraType = photonSim

frontRight.robotToCamera.xMeters = 0.3683
frontRight.robotToCamera.yMeters = 0.0
frontRight.robotToCamera.zMeters = 0.552831
frontRight.robotToCamera.rollDegrees = 0 
frontRight.robotToCamera.pitchDegrees = 5
frontRight.robotToCamera.yawDegrees = 0

frontRight.settings.fps = 30
frontRight.settings.resWidth = 800
frontRight.settings.resHeight = 600

# front left
frontLeft.cameraType = photonSim

frontLeft.robotToCamera.xMeters = 0.3683
frontLeft.robotToCamera.yMeters = 0.0
frontLeft.robotToCamera.zMeters = 0.552831
frontLeft.robotToCamera.rollDegrees = 0 
frontLeft.robotToCamera.pitchDegrees = 5
frontLeft.robotToCamera.yawDegrees = 0

frontLeft.settings.fps = 30
frontLeft.settings.resWidth = 800
frontLeft.settings.resHeight = 600


