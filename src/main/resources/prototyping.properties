robot.name = PROTOTYPING

# prototypeMotor1
prototypeMotor1.motor.motorController = sim

# prototypeMotor1: io settings
prototypeMotor1.IOSettings.inverted = false
prototypeMotor1.IOSettings.gearing = 1.0
prototypeMotor1.IOSettings.drumRadiusMeters = 1.0
prototypeMotor1.IOSettings.pid.kp = 0.0
prototypeMotor1.IOSettings.pid.ki = 0.0
prototypeMotor1.IOSettings.pid.kd = 0.0

# prototypeMotor1:the motorController settings 
prototypeMotor1.talonFX.setting.id = 00

