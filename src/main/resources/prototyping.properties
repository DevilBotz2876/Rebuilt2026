prototypeMotor1.flywheelSettings.maxVelocityInRPMs = 6000.0
prototypeMotor1.flywheelSettings.targetVelocityToleranceInRPMs = 100.0
prototypeMotor1.flywheelSettings.DCMotor = KrakenX60
